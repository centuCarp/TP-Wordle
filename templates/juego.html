<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wordle - Juego</title>
        <link rel="stylesheet" href="{{ url_for('static', filename = 'juego.css') }}">
    </head>
    <body>
        <header class="header">
            <h1>WORDLE</h1>
        </header>

        <main class="game-container">
            <!-- Tablero de 6 filas y 5 columnas -->
            <div id="board" class="board">
                <!-- Fila 1 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
                <!-- Fila 2 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
                <!-- Fila 3 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
                <!-- Fila 4 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
                <!-- Fila 5 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
                <!-- Fila 6 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
            </div>

            <!-- Teclado en pantalla -->
            <div id="keyboard" class="keyboard">
                <div class="keyboard-row">
                    <button class="key">Q</button>
                    <button class="key">W</button>
                    <button class="key">E</button>
                    <button class="key">R</button>
                    <button class="key">T</button>
                    <button class="key">Y</button>
                    <button class="key">U</button>
                    <button class="key">I</button>
                    <button class="key">O</button>
                    <button class="key">P</button>
                </div>
                <div class="keyboard-row">
                    <button class="key">A</button>
                    <button class="key">S</button>
                    <button class="key">D</button>
                    <button class="key">F</button>
                    <button class="key">G</button>
                    <button class="key">H</button>
                    <button class="key">J</button>
                    <button class="key">K</button>
                    <button class="key">L</button>
                    <button class="key">Ñ</button>
                </div>
                <div class="keyboard-row">
                    <button class="key key-large" id="enter-key">ENTER</button>
                    <button class="key">Z</button>
                    <button class="key">X</button>
                    <button class="key">C</button>
                    <button class="key">V</button>
                    <button class="key">B</button>
                    <button class="key">N</button>
                    <button class="key">M</button>
                    <button class="key key-large" id="backspace-key">⌫</button>
                </div>
            </div>
        </main>
        <script>
            let filaActual = 0;
            let columnaActual = 0;
            const matrizIntentos = Array(6).fill("").map(() => Array(5).fill(""));

            const filas = document.querySelectorAll('.board .row');

            // Capturar teclado físico
            document.addEventListener('keydown', (e) => {
                const letra = e.key.toUpperCase();
                if (e.key === 'Enter') {
                    procesarEnter();
                } else if (e.key === 'Backspace') {
                    procesarBorrar();
                } else if (/^[A-ZÑ]$/.test(letra)) {
                    procesarLetra(letra);
                }
            });

            // Capturar clicks en el teclado virtual
            document.querySelectorAll('.key').forEach(button => {
                button.addEventListener('click', () => {
                    if (button.id === 'enter-key') {
                        procesarEnter();
                    } else if (button.id === 'backspace-key') {
                        procesarBorrar();
                    } else {
                        procesarLetra(button.textContent.trim());
                    }
                });
            });

            function procesarLetra(letra) {
                if (columnaActual < 5 && filaActual < 6) {
                    matrizIntentos[filaActual][columnaActual] = letra;
                    filas[filaActual].children[columnaActual].textContent = letra;
                    columnaActual++;
                }
            }

            function procesarBorrar() {
                if (columnaActual > 0) {
                    columnaActual--;
                    matrizIntentos[filaActual][columnaActual] = "";
                    filas[filaActual].children[columnaActual].textContent = "";
                }
            }

            function procesarEnter() {
                if (columnaActual < 5) {
                    alert("Tenés que completar 5 letras");
                    return;
                }

                const palabraIngresada = matrizIntentos[filaActual].join("");

                fetch('/api/guess', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word: palabraIngresada })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.error) {
                        alert(data.error);
                        return;
                    }

                    // Pintar las celdas según el resultado del servidor (ej: 'correct', 'present', 'absent')
                    const tiles = filas[filaActual].children;
                    data.resultado.forEach((estado, index) => {
                        tiles[index].classList.add(estado);
                    });

                    if(data.ganado) {
                        alert("¡Felicitaciones, ganaste!");
                        return;
                    }

                    filaActual++;
                    columnaActual = 0;

                    if (filaActual === 6 && !data.ganado) {
                        alert("¡Juego terminado! Te quedaste sin intentos.");
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        </script>
    </body>
</html>
