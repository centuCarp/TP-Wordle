<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wordle - Juego</title>
        <link rel="stylesheet" href="{{ url_for('static', filename = 'juego.css') }}">
    </head>
    <body>
        <header class="header">
            <h1>WORDLE</h1>
        </header>

        <main class="game-container">
            <!-- Tablero de 6 filas y 5 columnas -->
            <div id="board" class="board">
                <!-- Fila 1 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
                <!-- Fila 2 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
                <!-- Fila 3 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
                <!-- Fila 4 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
                <!-- Fila 5 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
                <!-- Fila 6 -->
                <div class="row">
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                    <div class="tile"></div>
                </div>
            </div>

             <!-- Teclado en pantalla -->
             <div id="keyboard" class="keyboard">
                <div class="keyboard-row">
                    <button class="key" data-key="Q">Q</button>
                    <button class="key" data-key="W">W</button>
                    <button class="key" data-key="E">E</button>
                    <button class="key" data-key="R">R</button>
                    <button class="key" data-key="T">T</button>
                    <button class="key" data-key="Y">Y</button>
                    <button class="key" data-key="U">U</button>
                    <button class="key" data-key="I">I</button>
                    <button class="key" data-key="O">O</button>
                    <button class="key" data-key="P">P</button>
                </div>
                <div class="keyboard-row">
                    <button class="key" data-key="A">A</button>
                    <button class="key" data-key="S">S</button>
                    <button class="key" data-key="D">D</button>
                    <button class="key" data-key="F">F</button>
                    <button class="key" data-key="G">G</button>
                    <button class="key" data-key="H">H</button>
                    <button class="key" data-key="J">J</button>
                    <button class="key" data-key="K">K</button>
                    <button class="key" data-key="L">L</button>
                    <button class="key" data-key="Ñ">Ñ</button>
                </div>
                <div class="keyboard-row">
                    <button class="key key-large" id="enter-key">ENTER</button>
                    <button class="key" data-key="Z">Z</button>
                    <button class="key" data-key="X">X</button>
                    <button class="key" data-key="C">C</button>
                    <button class="key" data-key="V">V</button>
                    <button class="key" data-key="B">B</button>
                    <button class="key" data-key="N">N</button>
                    <button class="key" data-key="M">M</button>
                    <button class="key key-large" id="backspace-key">⌫</button>
                </div>
            </div>
        </main>
        <!-- Modal de Fin de Partida -->
        <div id="gameModal" class="modal-overlay">
            <div class="modal-content">
                <h2 id="modal-titulo">ESTADÍSTICAS</h2>
                
                <!-- Tablero miniatura de resumen -->
                <div id="mini-board" class="mini-board">
                    <!-- Se generará dinámicamente con JS -->
                </div>

                <div id="modal-mensaje" class="palabra-revelada"></div>

                <button id="btn-reiniciar" class="btn-jugar-nuevo">Jugar de nuevo</button>
            </div>
        </div>
        <script>
            let filaActual = 0;
            let columnaActual = 0;
            const matrizIntentos = Array(6).fill("").map(() => Array(5).fill(""));
            const historialResultados = []; 

            const filas = document.querySelectorAll('.board .row');

            // Consultar al servidor el estado al cargar la página (para sobrevivir al F5)
            fetch('/api/estado')
                .then(res => res.json())
                .then(data => {
                    if (data.historial && data.historial.length > 0) {
                        data.historial.forEach((intento, index) => {
                            const palabra = intento.palabra;
                            const resultado = intento.resultado;
                            
                            historialResultados.push(resultado);

                            for (let c = 0; c < 5; c++) {
                                matrizIntentos[index][c] = palabra[c];
                                const tile = filas[index].children[c];
                                tile.textContent = palabra[c];
                                tile.classList.add(resultado[c]);
                            }
                        });
                        filaActual = data.historial.length;
                    }
                })
                .catch(err => console.error("Error al recuperar estado:", err));

            // Capturar teclado físico
            document.addEventListener('keydown', (e) => {
                const letra = e.key.toUpperCase();
                if (e.key === 'Enter') {
                    procesarEnter();
                } else if (e.key === 'Backspace') {
                    procesarBorrar();
                } else if (/^[A-ZÑ]$/.test(letra)) {
                    procesarLetra(letra);
                }
            });

            // Capturar clicks en el teclado virtual
            document.querySelectorAll('.key').forEach(button => {
                button.addEventListener('click', () => {
                    if (button.id === 'enter-key') {
                        procesarEnter();
                    } else if (button.id === 'backspace-key') {
                        procesarBorrar();
                    } else {
                        procesarLetra(button.getAttribute('data-key'));
                    }
                });
            });

            // Botón Jugar de Nuevo del Modal
            document.getElementById('btn-reiniciar').addEventListener('click', () => {
                fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('gameModal').style.display = 'none';

                    filaActual = 0;
                    columnaActual = 0;
                    for (let r = 0; r < 6; r++) {
                        for (let c = 0; c < 5; c++) {
                            matrizIntentos[r][c] = "";
                            filas[r].children[c].textContent = "";
                            filas[r].children[c].className = "tile"; 
                        }
                    }
                    historialResultados.length = 0; 
                })
                .catch(error => console.error('Error al reiniciar:', error));
            });

            function procesarLetra(letra) {
                if (columnaActual < 5 && filaActual < 6) {
                    matrizIntentos[filaActual][columnaActual] = letra;
                    filas[filaActual].children[columnaActual].textContent = letra;
                    columnaActual++;
                }
            }

            function procesarBorrar() {
                if (columnaActual > 0) {
                    columnaActual--;
                    matrizIntentos[filaActual][columnaActual] = "";
                    filas[filaActual].children[columnaActual].textContent = "";
                }
            }

            function procesarEnter() {
                if (columnaActual < 5) {
                    alert("Tenés que completar 5 letras");
                    return;
                }

                const palabraIngresada = matrizIntentos[filaActual].join("");

                fetch('/api/guess', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word: palabraIngresada })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.error) {
                        alert(data.error);
                        return;
                    }

                    const tiles = filas[filaActual].children;
                    const estadosFila = [];

                    data.resultado.forEach((estado, index) => {
                        tiles[index].classList.add(estado);
                        estadosFila.push(estado);
                    });

                    historialResultados.push(estadosFila);

                    if(data.ganado) {
                        mostrarModal(true, data.palabra_secreta || "");
                        return;
                    }

                    filaActual++;
                    columnaActual = 0;

                    if (filaActual === 6 && !data.ganado) {
                        mostrarModal(false, data.palabra_secreta || "");
                    }
                })
                .catch(error => console.error('Error:', error));
            }

            function mostrarModal(ganado, palabraSecreta) {
                const modal = document.getElementById('gameModal');
                const titulo = document.getElementById('modal-titulo');
                const mensaje = document.getElementById('modal-mensaje');
                const miniBoard = document.getElementById('mini-board');

                titulo.textContent = ganado ? "¡EXCELENTE!" : "GAME OVER";
                mensaje.textContent = `La palabra era: ${palabraSecreta}`;

                miniBoard.innerHTML = "";
                for (let r = 0; r < 6; r++) {
                    const rowDiv = document.createElement('div');
                    rowDiv.classList.add('mini-row');
                    
                    for (let c = 0; c < 5; c++) {
                        const tileDiv = document.createElement('div');
                        tileDiv.classList.add('mini-tile');
                        
                        if (historialResultados[r] && historialResultados[r][c]) {
                            tileDiv.classList.add(historialResultados[r][c]);
                        }
                        rowDiv.appendChild(tileDiv);
                    }
                    miniBoard.appendChild(rowDiv);
                }

                modal.style.display = 'flex';
            }

            // Jerarquía de prioridad para los colores del teclado (Verde > Amarillo > Gris)
            const prioridadColores = {
                "correct": 3,
                "present": 2,
                "absent": 1
            };

            const estadosTeclas = {};

            function actualizarTeclado(palabra, resultados) {
                for (let i = 0; i < palabra.length; i++) {
                    const letra = palabra[i];
                    const estadoNuevo = resultados[i]; // 'correct', 'present', 'absent'
                    const estadoActual = estadosTeclas[letra];

                    // Si la letra no tiene estado o el nuevo estado tiene mayor prioridad, lo actualizamos
                    if (!estadoActual || prioridadColores[estadoNuevo] > prioridadColores[estadoActual]) {
                        estadosTeclas[letra] = estadoNuevo;
                    }
                }

                // Aplicar las clases visuales a los botones del teclado virtual
                document.querySelectorAll('.key[data-key]').forEach(button => {
                    const letraBtn = button.getAttribute('data-key');
                    if (estadosTeclas[letraBtn]) {
                        // Limpiamos clases previas y asignamos la nueva
                        button.classList.remove('correct', 'present', 'absent');
                        button.classList.add(estadosTeclas[letraBtn]);
                    }
                });
            }

        </script>
    </body>
</html>
